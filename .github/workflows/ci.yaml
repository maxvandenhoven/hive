name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"
          enable-cache: true

      # `uv sync` builds the Rust extension `hive._core` with the toolchain pinned in
      # `rust-toolchain.toml`, which the preinstalled rustup fetches on first use.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The `train` extra (torch, Ultralytics) is only used on the workstation.
      - name: Sync dependencies
        run: uv sync --locked --all-groups --all-extras --no-extra train

      - name: Check
        run: make format-python lint-python type-python

      - name: Verify formatting left no changes
        run: git diff --exit-code

      - name: Test
        run: make test-python

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check the API client is up to date
        working-directory: .
        run: |
          uv sync --locked --extra api
          make api-client
          git diff --exit-code -- frontend/src/api/schema.ts

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The bindings build against the Python of `.venv` (see `rust/.cargo/config.toml`).
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"

      - name: Create the Python environment of the bindings
        run: uv venv --python 3.13

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: make format-rust && git diff --exit-code

      - name: Lint
        run: make lint-rust

      - name: Test
        run: make test-rust
