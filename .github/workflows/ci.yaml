name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups --all-extras

      - name: Check
        run: make check

      - name: Verify formatting left no changes
        run: git diff --exit-code

      - name: Test
        run: make test
