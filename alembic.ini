# Alembic configuration for writing migrations, for example:
#
#   uv run alembic revision --autogenerate --rev-id 0002 -m "Add a column"
#
# The migration environment connects to `HIVE_DATABASE_URL` (environment or `.env`).
# The app and `hive db upgrade` do not read this file; they use the packaged migrations.

[alembic]
script_location = %(here)s/src/hive/api/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
