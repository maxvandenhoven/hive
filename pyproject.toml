[project]
name = "hive"
version = "0.1.0"
description = "Hive engine, search agents and a web app for tracking physical games."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.optional-dependencies]
plotting = [
    "drawsvg>=2.4.2",
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
]
api = [
    "alembic>=1.20.1",
    "asgi-correlation-id>=5.0.1",
    "boto3>=1.43.118",
    "fastapi>=0.162.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-json-logger>=4.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]
vision = [
    "numpy>=2.3.4",
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=5.0.0.93",
]
train = [
    "onnx>=1.23.2",
    "onnxslim>=0.1.99",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "ultralytics>=8.4.211",
]

[project.scripts]
hive = "hive.cli:app"

[tool.uv]
# Ultralytics depends on `opencv-python`, which installs the same `cv2` module as the
# headless build of the `vision` extra; the headless build serves both.
override-dependencies = ["opencv-python; sys_platform == 'never'"]
# Rebuild the Rust extension `hive._core` when its sources change (see tooling.md §Rust).
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/**/*.rs" },
    { file = "rust/**/Cargo.toml" },
    { file = "rust/Cargo.lock" },
]

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

# The package is pure Python apart from `hive._core`, the Rust core of the engine and the
# search, which maturin builds from `rust/python` with the release profile.
[tool.maturin]
manifest-path = "rust/python/Cargo.toml"
python-source = "src"
module-name = "hive._core"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.9",
    "moto[s3]>=5.2.4",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "testcontainers[postgres]>=4.15.0",
    "ty>=0.0.91",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 90
indent-width = 4
include = ["src/**/*.py", "src/**/*.pyi", "tests/**/*.py", "scripts/**/*.py", "blender/**/*.py"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "D",  # pydocstyle
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "EM",  # flake8-errmsg
    "T20",  # flake8-print
    "RET",  # flake8-return
    "ANN",  # flake8-annotations
    "UP",  # pyupgrade
]
ignore = [
    "D100",  # Ignore missing docstring in public module
    "D104",  # Ignore missing docstring in public package
    "ANN002",  # Ignore missing *args type annotations
    "ANN003",  # Ignore missing **kwargs type annotations
    "ANN401",  # Ignore Any type annotations
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D100",  # Ignore missing docstring in public module
    "D101",  # Ignore missing docstring in public class
    "D102",  # Ignore missing docstring in public method
    "D103",  # Ignore missing docstring in public function
    "D104",  # Ignore missing docstring in public package
    "D107",  # Ignore missing docstring in __init__ method
]

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["scripts", "scripts/tooling", "blender", "tests"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

# The `train` extra is not installed in CI, so its imports may not resolve there.
[[tool.ty.overrides]]
include = ["scripts/train/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "scripts/tooling", "blender", "tests"]
addopts = ["--strict-markers"]
markers = ["slow: long-running tests, excluded from `make test` (run with `make test-slow`)"]

[tool.coverage.run]
source = ["src/hive"]
core = "sysmon"
concurrency = ["multiprocessing", "thread"]
omit = ["src/hive/plotting/*", "src/hive/assets/*"]
