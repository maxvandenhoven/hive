[workspace]
members = ["core", "python"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
hive-core = { path = "core" }
pyo3 = "0.30.1"
serde_json = "1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_docs_in_private_items = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "fat"
codegen-units = 1

# Perft parity and the debug invariants run in `cargo test`, which would be slow without
# optimisation; overflow checks and debug assertions stay on.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
